name: Offline orders checks
on:
  push:
    branches:
      - feat/offline-orders-sync-2026-10-12
  pull_request:
    branches:
      - feat/offline-orders-sync-2026-10-12
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix server
      - name: Type-check frontend and backend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Test order synchronization
        run: npm --prefix server test
